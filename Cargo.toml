[workspace]
resolver = "2"
members = [
    "crates/brep-math",
    "crates/brep-geom",
    "crates/brep-topo",
    "crates/brep-ops",
    "crates/oracle-harness",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
robust = "1.2"
slotmap = { version = "1.1", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"